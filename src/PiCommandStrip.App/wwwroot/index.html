<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pi Command Strip</title>
    <link rel="stylesheet" href="/css/site.css">
</head>
<body>
    <main class="dashboard">
        <header>
            <p class="eyebrow">Local dashboard</p>
            <h1>Pi Command Strip</h1>
            <p class="intro">The first building block for a context-aware touchscreen command strip.</p>
        </header>

        <div class="status-stack">
            <section class="status-card" aria-labelledby="connection-heading">
                <div class="status-row">
                    <span id="websocket-indicator" class="status-indicator" aria-hidden="true"></span>
                    <div>
                        <h2 id="connection-heading">WebSocket</h2>
                        <p id="websocket-status" role="status" aria-live="polite">Connecting&hellip;</p>
                    </div>
                </div>
                <div class="ping-row">
                    <button id="ping-button" type="button" disabled>Ping server</button>
                    <p id="ping-result" aria-live="polite">No ping sent yet.</p>
                </div>
            </section>

            <section class="status-card" aria-labelledby="health-heading">
                <div class="status-row">
                    <span id="health-indicator" class="status-indicator" aria-hidden="true"></span>
                    <div>
                        <h2 id="health-heading">Application health</h2>
                        <p id="health-status" role="status" aria-live="polite">Checking /health&hellip;</p>
                    </div>
                </div>
                <dl id="health-details" hidden>
                    <div>
                        <dt>Application</dt>
                        <dd id="application-name">&mdash;</dd>
                    </div>
                    <div>
                        <dt>Server time</dt>
                        <dd id="timestamp">&mdash;</dd>
                    </div>
                </dl>
            </section>
        </div>
    </main>

    <script src="/js/dashboard.js"></script>
</body>
</html>
